# Publie une release quand on pousse un tag « v… » : le JS de la carte + tous les assets à plat en pièces jointes.
# C'est ce que HACS télécharge (et installe en local dans /config/www/community/configurateur-3d-card-hd/).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node tools/release-assets.mjs
      - name: Créer la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes "Édition HD : carte + textures PBR et HDRI (Poly Haven, CC0), installées en local par HACS."
